<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO8583 Parser Web Interface</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 30px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; background: #eee; border: 1px solid #ddd; border-bottom: none; margin-right: 5px; border-radius: 5px 5px 0 0; }
        .tab.active { background: #fff; border-bottom: 1px solid #fff; margin-bottom: -1px; font-weight: bold; color: #3498db; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-family: monospace; }
        button { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .file-input-wrapper { border: 2px dashed #ccc; padding: 40px; text-align: center; border-radius: 4px; margin-bottom: 10px; }
        pre { background-color: #2c3e50; color: #ecf0f1; padding: 20px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; font-size: 14px; }
        .error { color: #e74c3c; font-weight: bold; }
        .success { color: #2ecc71; font-weight: bold; }
        .result-section { margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ISO8583 Parser framework</h1>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('hex-tab')">Raw Hex String</div>
        <div class="tab" onclick="switchTab('file-tab')">Binary File Upload (.bin)</div>
        <!-- NEW: Builder Tab -->
        <div class="tab" onclick="switchTab('build-tab')">Build ISO from JSON</div>
    </div>

    <div id="hex-tab" class="tab-content active">
        <p>Paste your raw ISO8583 ASCII/Hex string here:</p>
        <textarea id="hexInput" placeholder="e.g. 020070000000000000001640000000000000..."></textarea>
        <button onclick="parseHex()">Parse Hex String</button>
    </div>

    <div id="file-tab" class="tab-content">
        <p>Upload a .bin file containing one or more ISO8583 messages:</p>
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" accept=".bin,.dat">
        </div>
        <button onclick="parseFile()">Parse Binary File</button>
    </div>

    <!-- NEW: Builder Content -->
    <div id="build-tab" class="tab-content">
        <p>Paste your JSON payload here to build a raw ISO8583 string:</p>
        <textarea id="jsonInput" placeholder='{&#10;  "0": "0200",&#10;  "3": "000000"&#10;}'></textarea>
        <button onclick="buildIso()">Build Raw ISO</button>
    </div>

    <div class="result-section">
        <h3>Result: <span id="statusMessage"></span></h3>
        <pre id="jsonOutput">No data yet.</pre>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        clearOutput();
    }

    function clearOutput() {
        document.getElementById('jsonOutput').innerText = 'No data yet.';
        document.getElementById('statusMessage').innerText = '';
    }

    function displayResult(data, isError = false) {
        const out = document.getElementById('jsonOutput');
        const status = document.getElementById('statusMessage');
        out.innerText = JSON.stringify(data, null, 2);

        if (isError) {
            status.innerHTML = '<span class="error">Failed</span>';
            out.style.color = '#e74c3c';
        } else {
            status.innerHTML = '<span class="success">Success!</span>';
            out.style.color = '#ecf0f1';
        }
    }

    async function parseHex() {
        const hex = document.getElementById('hexInput').value;
        if (!hex) { alert("Please enter a hex string"); return; }

        try {
            const response = await fetch('/api/parse/hex', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hex: hex })
            });
            const data = await response.json();
            displayResult(data, !response.ok);
        } catch (err) {
            displayResult({ error: err.message }, true);
        }
    }

    async function parseFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) { alert("Please select a file"); return; }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/api/parse/file', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            displayResult(data, !response.ok);
        } catch (err) {
            displayResult({ error: err.message }, true);
        }
    }

    // NEW: Builder Logic
    async function buildIso() {
        const input = document.getElementById('jsonInput').value;
        if (!input) { alert("Please enter JSON data"); return; }

        const out = document.getElementById('jsonOutput');
        const status = document.getElementById('statusMessage');
        out.innerText = 'Processing...';
        status.innerText = '';

        try {
            // Validate JSON format on the frontend first
            const jsonPayload = JSON.parse(input);

            const response = await fetch('/api/iso8583/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jsonPayload)
            });

            // The builder returns a raw string, not a JSON object
            const text = await response.text();

            if (response.ok) {
                out.innerText = text;
                status.innerHTML = '<span class="success">Success!</span>';
                out.style.color = '#ecf0f1';
            } else {
                displayResult({ error: text }, true);
            }
        } catch (err) {
            if (err instanceof SyntaxError) {
                displayResult({ error: "Invalid JSON format. Check your syntax." }, true);
            } else {
                displayResult({ error: err.message }, true);
            }
        }
    }
</script>
</body>
</html>
